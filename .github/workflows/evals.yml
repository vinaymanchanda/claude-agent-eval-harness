name: evals

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests/ -q

      # Runs offline against the mock provider: no API key, no spend.
      # Mock is deterministic, so anything below 100% is a harness bug.
      - name: Eval suite (mock)
        run: python -m evals.runner --provider mock --threshold 1.0
